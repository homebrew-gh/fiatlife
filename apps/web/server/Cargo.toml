[package]
name = "fiatlife-web"
version = "0.1.0"
edition = "2021"
description = "FiatLife web/Start9 backend."
license = "MIT"
publish = false

[[bin]]
name = "fiatlife-web"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "macros", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie-signed"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "set-header"] }
http = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nostr = { version = "0.44", default-features = false, features = ["std", "nip44"] }
nostr-sdk = { version = "0.44", default-features = false, features = ["nip44"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
native-tls = "0.2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["rustls-tls-native-roots", "native-tls", "connect", "handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
